# Runs on the Bifrost VM from /srv/bifrost; the edge proxies bifrost.kineuro.se to :8080.
# The exchange dataset from Midgard is mounted on the VM at /exchange; the container sees only that.
services:
  bifrost:
    build: .
    image: kineuro/bifrost:local
    restart: unless-stopped
    user: "1600:1600"
    ports:
      - "8080:8080"
    env_file: .env          # SECRET, ADMIN_KEY, ALERTMANAGER_URL (never committed)
    environment:
      PUBLIC_URL: https://bifrost.kineuro.se
      EXCHANGE_ROOT: /exchange
      BIFROST_VERSION: ${BIFROST_VERSION:-dev}
      BIN_DIR: /app/server/bin
      # Every file read, write and hash goes through libuv's threadpool, which is four threads unless it is told
      # otherwise. With dozens of transfer streams in flight that is the queue everything waits in, and a listing
      # of a large inbox waits behind all of it. Give it room; these threads only ever block on the filesystem.
      UV_THREADPOOL_SIZE: "32"
    volumes:
      - /exchange:/exchange
      - ./bin:/app/server/bin:ro
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
