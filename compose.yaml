# Runs on the Bifrost VM from /srv/bifrost; the edge proxies bifrost.kineuro.se to :8080.
# The exchange dataset from Midgard is mounted on the VM at /exchange; the container sees only that.
services:
  bifrost:
    build: .
    image: kineuro/bifrost:local
    restart: unless-stopped
    user: "1600:1600"
    ports:
      - "8080:8080"
    env_file: .env          # SECRET, ADMIN_KEY, ALERTMANAGER_URL (never committed)
    environment:
      PUBLIC_URL: https://bifrost.kineuro.se
      EXCHANGE_ROOT: /exchange
      BIFROST_VERSION: ${BIFROST_VERSION:-dev}
      BIN_DIR: /app/server/bin
      # libuv's threadpool is four threads unless it is told otherwise, and every file read and write queues in
      # it. Eight gives the transfer streams room on this four core VM. Thirty two did not: the exchange is NFS,
      # and that many metadata operations at once put every new one behind a deep queue, including the ones the
      # event loop makes on its own thread. Availability went from 100% to 75% until this came back down.
      UV_THREADPOOL_SIZE: "8"
    volumes:
      - /exchange:/exchange
      - ./bin:/app/server/bin:ro
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
